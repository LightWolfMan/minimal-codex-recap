<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Demonstração do Minimal Codex Recap</title>
  <desc id="desc">Uma janela semelhante a um terminal mostrando o comando $recap e sua resposta de três linhas em português brasileiro.</desc>
  <rect width="1200" height="500" rx="28" fill="#0b1020"/>
  <rect x="36" y="36" width="1128" height="428" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="64" rx="20" fill="#1e293b"/>
  <rect x="36" y="80" width="1128" height="20" fill="#1e293b"/>
  <circle cx="78" cy="68" r="9" fill="#fb7185"/>
  <circle cx="108" cy="68" r="9" fill="#fbbf24"/>
  <circle cx="138" cy="68" r="9" fill="#4ade80"/>
  <text x="600" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1">Codex · tarefa atual</text>
  <text x="78" y="158" font-family="Cascadia Code, Consolas, monospace" font-size="25" fill="#94a3b8">&gt;</text>
  <text x="114" y="158" font-family="Cascadia Code, Consolas, monospace" font-size="25" font-weight="700" fill="#c4b5fd">$recap</text>
  <line x1="78" y1="190" x2="1122" y2="190" stroke="#334155" stroke-width="1"/>
  <text x="78" y="246" font-family="Cascadia Code, Consolas, monospace" font-size="23" fill="#f8fafc">
    <tspan font-weight="700" fill="#67e8f9">Onde paramos:</tspan>
    <tspan> o skill foi instalado e a versão pública foi validada.</tspan>
  </text>
  <text x="78" y="306" font-family="Cascadia Code, Consolas, monospace" font-size="23" fill="#f8fafc">
    <tspan font-weight="700" fill="#fbbf24">Pendente:</tspan>
    <tspan> nada identificado.</tspan>
  </text>
  <text x="78" y="366" font-family="Cascadia Code, Consolas, monospace" font-size="23" fill="#f8fafc">
    <tspan font-weight="700" fill="#4ade80">Próxima ação:</tspan>
    <tspan> usar $recap quando precisar retomar o contexto.</tspan>
  </text>
  <text x="78" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64748b">somente manual · conversa atual · sem dependências de execução</text>
</svg>

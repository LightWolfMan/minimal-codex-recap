name: Validar skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Contrato · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validar contrato do skill
        run: python tests/validate_skill.py

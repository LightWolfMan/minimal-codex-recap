name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Contract · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate skill contract
        run: python tests/validate_skill.py
